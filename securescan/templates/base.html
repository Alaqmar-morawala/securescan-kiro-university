<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SecureScan — Web App Security Scanner</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="/">SecureScan</a>
    <div>
      {% if user.is_authenticated %}
        <a class="btn btn-sm btn-outline-light" href="/accounts/">Dashboard</a>
        <a class="btn btn-sm btn-outline-light" href="/history/">History</a>
        <form method="post" action="/accounts/logout/" class="d-inline">{% csrf_token %}<button class="btn btn-sm btn-light">Logout</button></form>
      {% else %}
        <a class="btn btn-sm btn-outline-light" href="/accounts/login/">Login</a>
        <a class="btn btn-sm btn-light" href="/accounts/register/">Register</a>
      {% endif %}
    </div>
  </div>
</nav>
<main class="container py-4">
{% block content %}{% endblock %}
</main>
</body>
</html>
